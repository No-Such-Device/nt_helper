name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FLUTTER_VERSION: '3.44.9'

jobs:
  test:
    name: Analyze and full Flutter suite
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Test developer and release scripts
        run: python3 -m unittest discover -s scripts -p 'test_*.py' -v
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          # Default keys include OS, architecture, Flutter version/hash, and
          # (for pub packages) pubspec.lock. Cache downloads, not build outputs.
          cache: true
          pub-cache: true
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter analyze --no-pub --fatal-infos
      - name: Full Flutter suite
        if: ${{ !cancelled() }}
        run: flutter test --no-pub

  ci-success:
    name: CI success
    if: always()
    needs: test
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 5
    steps:
      - name: Require analysis and the full test suite
        env:
          TEST_RESULT: ${{ needs.test.result }}
        run: |
          test "$TEST_RESULT" = success
