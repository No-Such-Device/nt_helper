name: Multi-Platform Build

on:
  push:
    tags:
      - "v*" # e.g., v1.0, v1.2.3, etc.
  workflow_dispatch:
    inputs:
      platforms:
        description: 'Platforms to build (comma-separated: android,android_aab,windows,linux,macos,macos_testflight,ios) or "all"'
        required: false
        default: 'all'
        type: string

env:
  FLUTTER_VERSION: "3.44.4"
  ANDROID_NDK_VERSION: "27.0.12077973"

permissions:
  contents: write # Needed for creating/updating GitHub releases

jobs:
  setup:
    name: Setup Build Info
    runs-on: [self-hosted, Linux, X64]
    outputs:
      version: ${{ steps.get_version.outputs.version }}
      tag: ${{ steps.get_version.outputs.tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0  # Fetch all history and tags

      - name: Get version and tag
        id: get_version
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            # Tag push - use the tag
            TAG="${{ github.ref_name }}"
          else
            # Manual dispatch - get latest tag
            TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          fi
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Using tag: $TAG, version: $VERSION"

  create-release:
    name: Create Release
    runs-on: [self-hosted, Linux, X64]
    needs: setup
    # Only create release on tag push
    if: github.event_name == 'push'
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0  # Fetch all history and tags for release notes

      - name: Generate Release Notes
        run: |
          chmod +x ./scripts/release-notes-for-workflow.sh
          ./scripts/release-notes-for-workflow.sh ${{ needs.setup.outputs.tag }}

      - name: Create GitHub Release
        uses: ncipollo/release-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ needs.setup.outputs.tag }}
          name: "${{ needs.setup.outputs.tag }} - Automated Release"
          bodyFile: release_notes.md
          generateReleaseNotes: false

  android:
    name: Build and Sign Android APK
    runs-on: [self-hosted, Linux, X64]
    needs: [setup, create-release]
    if: |
      always() &&
      needs.setup.result == 'success' &&
      (needs.create-release.result == 'success' || needs.create-release.result == 'skipped') &&
      (
        github.event_name == 'push' ||
        contains(github.event.inputs.platforms, 'android') ||
        github.event.inputs.platforms == 'all' ||
        github.event.inputs.platforms == ''
      )
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set Version
        run: echo "VERSION=${{ needs.setup.outputs.version }}" >> $GITHUB_ENV

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Install Android NDK
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="${SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"

          for attempt in 1 2 3; do
            if yes | "$SDKMANAGER" --install "ndk;${ANDROID_NDK_VERSION}"; then
              break
            fi

            rm -rf "${SDK_ROOT}/ndk/${ANDROID_NDK_VERSION}" "${SDK_ROOT}/.temp"
            if [ "$attempt" = "3" ]; then
              exit 1
            fi
            sleep 10
          done

          test -d "${SDK_ROOT}/ndk/${ANDROID_NDK_VERSION}"

      - name: Clone and Build UVCCamera Native Library
        run: |
          UVCCAMERA_DIR="$(mktemp -d "$RUNNER_TEMP/UVCCamera.XXXXXX")"
          git clone \
            --branch feature/16kb-page-size-compliance \
            --single-branch \
            https://github.com/DigifinityLtd/UVCCamera.git \
            "$UVCCAMERA_DIR"
          cd "$UVCCAMERA_DIR"
          ./gradlew :lib:assembleRelease
          ./gradlew :lib:publishToMavenLocal

      - name: Install dependencies
        run: flutter pub get

      - name: Decode and Save Keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > "$RUNNER_TEMP/release-key.jks"

      - name: Build Android APK
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release-key.jks
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: flutter build apk --release

      - name: List build output (debug)
        run: ls -R build/app/outputs/flutter-apk

      - name: Rename Android APK
        run: mv ./build/app/outputs/flutter-apk/app-release.apk ./build/app/outputs/flutter-apk/nt_helper-${VERSION}.apk

      - name: Upload Android Artifact to Release
        uses: ncipollo/release-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ needs.setup.outputs.tag }}
          allowUpdates: true
          omitBodyDuringUpdate: true
          artifacts: "**/nt_helper-${{ env.VERSION }}.apk"

  android_aab_play_store:
    name: Build Android AAB and Upload to Play Store
    runs-on: [self-hosted, Linux, X64]
    needs: [setup, create-release]
    if: |
      always() &&
      needs.setup.result == 'success' &&
      (needs.create-release.result == 'success' || needs.create-release.result == 'skipped') &&
      (
        github.event_name == 'push' ||
        contains(github.event.inputs.platforms, 'android_aab') ||
        github.event.inputs.platforms == 'all' ||
        github.event.inputs.platforms == ''
      )
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set Version
        run: echo "VERSION=${{ needs.setup.outputs.version }}" >> $GITHUB_ENV

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Install Android NDK
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="${SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"

          for attempt in 1 2 3; do
            if yes | "$SDKMANAGER" --install "ndk;${ANDROID_NDK_VERSION}"; then
              break
            fi

            rm -rf "${SDK_ROOT}/ndk/${ANDROID_NDK_VERSION}" "${SDK_ROOT}/.temp"
            if [ "$attempt" = "3" ]; then
              exit 1
            fi
            sleep 10
          done

          test -d "${SDK_ROOT}/ndk/${ANDROID_NDK_VERSION}"

      - name: Clone and Build UVCCamera Native Library
        run: |
          UVCCAMERA_DIR="$(mktemp -d "$RUNNER_TEMP/UVCCamera.XXXXXX")"
          git clone \
            --branch feature/16kb-page-size-compliance \
            --single-branch \
            https://github.com/DigifinityLtd/UVCCamera.git \
            "$UVCCAMERA_DIR"
          cd "$UVCCAMERA_DIR"
          ./gradlew :lib:assembleRelease
          ./gradlew :lib:publishToMavenLocal

      - name: Install dependencies
        run: flutter pub get

      - name: Decode and Save Keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > "$RUNNER_TEMP/release-key.jks"

      - name: Build Android App Bundle
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release-key.jks
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: flutter build appbundle --release --dart-define=PLAY_STORE_BUILD=true

      - name: List build output (debug)
        run: ls -R build/app/outputs/bundle/release

      - name: Rename Android AAB
        run: mv ./build/app/outputs/bundle/release/app-release.aab ./build/app/outputs/bundle/release/nt_helper-${VERSION}.aab

      - name: Save AAB as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: nt_helper-${{ env.VERSION }}.aab
          path: ./build/app/outputs/bundle/release/nt_helper-${{ env.VERSION }}.aab

      - name: Upload AAB to Google Play
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: dev.nosuch.nt_helper
          releaseFiles: ./build/app/outputs/bundle/release/nt_helper-${{ env.VERSION }}.aab
          track: internal
          status: completed

  windows:
    name: Build Windows App
    runs-on: windows-latest
    needs: [setup, create-release]
    if: |
      always() &&
      github.event_name == 'workflow_dispatch' &&
      needs.setup.result == 'success' &&
      (needs.create-release.result == 'success' || needs.create-release.result == 'skipped') &&
      (
        contains(github.event.inputs.platforms, 'windows') ||
        github.event.inputs.platforms == 'all' ||
        github.event.inputs.platforms == ''
      )
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set Version
        shell: pwsh
        run: |
          "VERSION=${{ needs.setup.outputs.version }}" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows
        run: flutter build windows

      - name: Bundle nt-flash for Windows
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $release = gh release view --repo thorinside/nt-flash --json tagName,assets | ConvertFrom-Json
          $asset = $release.assets |
            Where-Object { $_.name -like "*-windows.zip" } |
            Select-Object -First 1
          if ($null -eq $asset) {
            throw "The latest nt-flash release has no Windows zip asset"
          }
          if (-not $asset.digest -or -not $asset.digest.StartsWith("sha256:")) {
            throw "The nt-flash Windows asset has no SHA-256 digest"
          }

          $archivePath = Join-Path $env:RUNNER_TEMP $asset.name
          gh release download $release.tagName `
            --repo thorinside/nt-flash `
            --pattern $asset.name `
            --output $archivePath

          $expectedDigest = $asset.digest.Substring(7).ToLowerInvariant()
          $actualDigest = (Get-FileHash -Algorithm SHA256 $archivePath).Hash.ToLowerInvariant()
          if ($actualDigest -ne $expectedDigest) {
            throw "nt-flash Windows asset SHA-256 mismatch"
          }

          $extractDir = Join-Path $env:RUNNER_TEMP "nt-flash-windows"
          Expand-Archive -Path $archivePath -DestinationPath $extractDir -Force
          $binary = Get-ChildItem -Path $extractDir -Filter "nt-flash.exe" -Recurse -File |
            Select-Object -First 1
          if ($null -eq $binary) {
            throw "The nt-flash Windows archive contains no nt-flash.exe"
          }

          $destination = "build/windows/x64/runner/Release/nt-flash.exe"
          Copy-Item -Path $binary.FullName -Destination $destination

      - name: Verify Windows bundle dependencies
        shell: pwsh
        run: |
          $releaseDir = "build/windows/x64/runner/Release"
          $sqliteDll = Join-Path $releaseDir "sqlite3.dll"
          $flashTool = Join-Path $releaseDir "nt-flash.exe"
          $manifest = Join-Path $releaseDir "data/flutter_assets/NativeAssetsManifest.json"
          if (-not (Test-Path $sqliteDll)) {
            throw "Windows release bundle is missing sqlite3.dll"
          }
          if (-not (Test-Path $flashTool)) {
            throw "Windows release bundle is missing nt-flash.exe"
          }
          if (-not (Test-Path $manifest)) {
            throw "Windows release bundle is missing NativeAssetsManifest.json"
          }
          if (-not (Select-String -Path $manifest -SimpleMatch '"sqlite3.dll"' -Quiet)) {
            throw "Windows native assets manifest does not reference sqlite3.dll"
          }

      - name: Verify Windows bundle omits VC++ runtime
        shell: pwsh
        run: |
          $releaseDir = "build/windows/x64/runner/Release"
          $forbiddenDlls = @("msvcp140.dll", "vcruntime140.dll", "vcruntime140_1.dll")
          foreach ($dllName in $forbiddenDlls) {
            if (Test-Path (Join-Path $releaseDir $dllName)) {
              throw "Windows release bundle must not include bundled VC++ runtime DLL: $dllName"
            }
          }

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build Windows Installer
        shell: pwsh
        run: |
          $env:VERSION = "${env:VERSION}"
          New-Item -ItemType Directory -Force -Path "build/windows/x64/installer" | Out-Null
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installers/windows/nt_helper.iss

      - name: Zip Windows App
        shell: pwsh
        run: |
          cd build/windows/x64/runner/Release
          Compress-Archive -Path * -DestinationPath "nt_helper-${env:VERSION}-windows.zip"

      - name: List build output (debug)
        run: |
          ls -R build/windows/x64/runner/Release
          ls -R build/windows/x64/installer

      - name: Upload Windows Artifact to Release
        uses: ncipollo/release-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ needs.setup.outputs.tag }}
          allowUpdates: true
          omitBodyDuringUpdate: true
          artifacts: "**/nt_helper-${{ env.VERSION }}-windows.zip,**/nt_helper-${{ env.VERSION }}-windows-setup.exe"

  linux:
    name: Build Linux App
    runs-on: [self-hosted, Linux, X64]
    needs: [setup, create-release]
    if: |
      always() &&
      needs.setup.result == 'success' &&
      (needs.create-release.result == 'success' || needs.create-release.result == 'skipped') &&
      (
        github.event_name == 'push' ||
        contains(github.event.inputs.platforms, 'linux') ||
        github.event.inputs.platforms == 'all' ||
        github.event.inputs.platforms == ''
      )
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set Version
        run: echo "VERSION=${{ needs.setup.outputs.version }}" >> $GITHUB_ENV

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Verify runner dependencies
        run: |
          for command in clang cmake ninja pkg-config zip; do
            if ! command -v "$command" >/dev/null; then
              echo "Missing required command on the self-hosted runner: $command" >&2
              exit 1
            fi
          done

          for package in gtk+-3.0 liblzma gstreamer-1.0 gstreamer-app-1.0; do
            if ! pkg-config --exists "$package"; then
              echo "Missing required pkg-config package on the self-hosted runner: $package" >&2
              exit 1
            fi
          done

          flutter pub get

      - name: Build Linux
        run: flutter build linux

      - name: Verify Linux SQLite Native Asset
        run: |
          BUNDLE_DIR="build/linux/x64/release/bundle"
          MANIFEST="$BUNDLE_DIR/data/flutter_assets/NativeAssetsManifest.json"
          SQLITE_LIB="$BUNDLE_DIR/lib/libsqlite3.so"

          test -f "$MANIFEST"
          test -f "$SQLITE_LIB"
          grep -Fq '"libsqlite3.so"' "$MANIFEST"

      - name: Zip Linux App
        run: |
          cd build/linux/x64/release/bundle
          zip -r nt_helper-${VERSION}-linux.zip *

      - name: List build output (debug)
        run: ls -R build/linux/x64/release/bundle

      - name: Upload Linux Artifact to Release
        uses: ncipollo/release-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ needs.setup.outputs.tag }}
          allowUpdates: true
          omitBodyDuringUpdate: true
          artifacts: "**/nt_helper-${{ env.VERSION }}-linux.zip"

  macos:
    name: Build macOS App
    runs-on: [self-hosted, macOS, ARM64]
    needs: [setup, create-release]
    if: |
      always() &&
      needs.setup.result == 'success' &&
      (needs.create-release.result == 'success' || needs.create-release.result == 'skipped') &&
      (
        github.event_name == 'push' ||
        contains(github.event.inputs.platforms, 'macos') ||
        github.event.inputs.platforms == 'all' ||
        github.event.inputs.platforms == ''
      )
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set Version
        run: echo "VERSION=${{ needs.setup.outputs.version }}" >> $GITHUB_ENV

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Install dependencies
        run: |
          flutter clean
          flutter pub get

      - name: Import Apple signing certificates
        uses: apple-actions/import-codesign-certs@v7
        with:
          keychain: ${{ runner.temp }}/nt-helper-${{ github.run_id }}-${{ github.job }}
          p12-file-base64: ${{ secrets.APPLE_CERTIFICATES }}
          p12-password: ${{ secrets.APPLE_CERTIFICATES_PASSWORD }}

      - name: Install Apple signing intermediates
        env:
          KEYCHAIN_PATH: ${{ runner.temp }}/nt-helper-${{ github.run_id }}-${{ github.job }}.keychain
        run: |
          curl --fail --location --silent --show-error \
            https://www.apple.com/certificateauthority/AppleWWDRCAG3.cer \
            --output "$RUNNER_TEMP/AppleWWDRCAG3.cer"
          curl --fail --location --silent --show-error \
            https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer \
            --output "$RUNNER_TEMP/DeveloperIDG2CA.cer"
          security import "$RUNNER_TEMP/AppleWWDRCAG3.cer" -k "$KEYCHAIN_PATH"
          security import "$RUNNER_TEMP/DeveloperIDG2CA.cer" -k "$KEYCHAIN_PATH"

      - name: Verify Developer ID signing identity
        env:
          KEYCHAIN_PATH: ${{ runner.temp }}/nt-helper-${{ github.run_id }}-${{ github.job }}.keychain
        run: |
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH" |
            grep -Fq "Developer ID Application: Neal Sanche (KN424RZG26)"

      - name: Build macOS
        run: flutter build macos

      - name: Codesign the macOS App
        run: |
          codesign --deep --force --verbose --options runtime \
            --sign "Developer ID Application: Neal Sanche (KN424RZG26)" \
            --entitlements macos/Runner/Release.entitlements \
            build/macos/Build/Products/Release/nt_helper.app

      - name: Zip the macOS App for Notarization
        run: |
          cd build/macos/Build/Products/Release
          ditto -c -k --keepParent nt_helper.app nt_helper.zip

      - name: Notarize the macOS App
        env:
          MACOS_APPLE_ID: ${{ secrets.MACOS_APPLE_ID }}
          MACOS_APPLE_ID_PASSWORD: ${{ secrets.MACOS_APPLE_ID_PASSWORD }}
          MACOS_APPLE_TEAM_ID: ${{ secrets.MACOS_APPLE_TEAM_ID }}
        run: |
          xcrun notarytool submit build/macos/Build/Products/Release/nt_helper.zip \
            --apple-id "$MACOS_APPLE_ID" \
            --password "$MACOS_APPLE_ID_PASSWORD" \
            --team-id "$MACOS_APPLE_TEAM_ID" \
            --wait

      - name: Staple Notarization to the App
        run: |
          xcrun stapler staple build/macos/Build/Products/Release/nt_helper.app

      - name: Zip macOS App
        run: |
          cd build/macos/Build/Products/Release
          ditto -c -k --keepParent nt_helper.app nt_helper-${VERSION}-macos.zip

      - name: List build output (debug)
        run: ls -R build/macos/Build/Products/Release

      - name: Upload macOS Artifact to Release
        uses: ncipollo/release-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ needs.setup.outputs.tag }}
          allowUpdates: true
          omitBodyDuringUpdate: true
          artifacts: "**/nt_helper-${{ env.VERSION }}-macos.zip"

  macos_testflight:
    name: Build macOS App and Upload to TestFlight
    runs-on: [self-hosted, macOS, ARM64]
    needs: [setup, create-release]
    if: |
      always() &&
      needs.setup.result == 'success' &&
      (needs.create-release.result == 'success' || needs.create-release.result == 'skipped') &&
      (
        github.event_name == 'push' ||
        contains(github.event.inputs.platforms, 'macos_testflight') ||
        github.event.inputs.platforms == 'all' ||
        github.event.inputs.platforms == ''
      )
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set Version
        run: echo "VERSION=${{ needs.setup.outputs.version }}" >> $GITHUB_ENV

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Install dependencies
        run: |
          flutter clean
          flutter pub get

      - name: Decode macOS provisioning profile from Base64
        env:
          PROFILE_BASE64: ${{ secrets.MAC_APP_STORE_PROVISIONPROFILE }}
        run: echo "$PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/mac_appstore.provisionprofile"

      - name: Decode nt-flash provisioning profile from Base64
        env:
          PROFILE_BASE64: ${{ secrets.NT_FLASH_PROVISIONPROFILE }}
        run: echo "$PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/nt_flash.provisionprofile"

      - name: Import Apple signing certificates
        uses: apple-actions/import-codesign-certs@v7
        with:
          keychain: ${{ runner.temp }}/nt-helper-${{ github.run_id }}-${{ github.job }}
          p12-file-base64: ${{ secrets.APPLE_CERTIFICATES }}
          p12-password: ${{ secrets.APPLE_CERTIFICATES_PASSWORD }}

      - name: Install Apple signing intermediates
        env:
          KEYCHAIN_PATH: ${{ runner.temp }}/nt-helper-${{ github.run_id }}-${{ github.job }}.keychain
        run: |
          curl --fail --location --silent --show-error \
            https://www.apple.com/certificateauthority/AppleWWDRCAG3.cer \
            --output "$RUNNER_TEMP/AppleWWDRCAG3.cer"
          curl --fail --location --silent --show-error \
            https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer \
            --output "$RUNNER_TEMP/DeveloperIDG2CA.cer"
          security import "$RUNNER_TEMP/AppleWWDRCAG3.cer" -k "$KEYCHAIN_PATH"
          security import "$RUNNER_TEMP/DeveloperIDG2CA.cer" -k "$KEYCHAIN_PATH"

      - name: Verify App Store signing identities
        env:
          KEYCHAIN_PATH: ${{ runner.temp }}/nt-helper-${{ github.run_id }}-${{ github.job }}.keychain
        run: |
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH" |
            grep -Fq "Apple Distribution: Neal Sanche (KN424RZG26)"
          security find-identity -v -p basic "$KEYCHAIN_PATH" |
            grep -Fq "3rd Party Mac Developer Installer: Neal Sanche (KN424RZG26)"

      - name: Install provisioning profiles
        run: |
          PROFILE_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          MAC_PROFILE_PATH="$PROFILE_DIR/nt-helper-${GITHUB_RUN_ID}-${GITHUB_JOB}.provisionprofile"
          NT_FLASH_PROFILE_PATH="$PROFILE_DIR/nt-flash-${GITHUB_RUN_ID}-${GITHUB_JOB}.provisionprofile"
          mkdir -p "$PROFILE_DIR"
          cp "$RUNNER_TEMP/mac_appstore.provisionprofile" "$MAC_PROFILE_PATH"
          cp "$RUNNER_TEMP/nt_flash.provisionprofile" "$NT_FLASH_PROFILE_PATH"
          echo "MAC_PROFILE_PATH=$MAC_PROFILE_PATH" >> "$GITHUB_ENV"
          echo "NT_FLASH_PROFILE_PATH=$NT_FLASH_PROFILE_PATH" >> "$GITHUB_ENV"
          echo "Provisioning profiles in that folder:"
          ls -la "$PROFILE_DIR"

      - name: Build macOS
        run: flutter build macos

      - name: Fix malformed framework bundles
        run: |
          # Apple requires versioned frameworks to have proper symlinks:
          #   Versions/Current -> A
          #   Resources -> Versions/Current/Resources
          FRAMEWORKS_DIR="build/macos/Build/Products/Release/nt_helper.app/Contents/Frameworks"
          for framework in "$FRAMEWORKS_DIR"/*.framework; do
            if [ -d "$framework/Versions/A" ] && [ ! -e "$framework/Versions/Current" ]; then
              echo "Fixing missing Current symlink in $(basename "$framework")"
              ln -s "A" "$framework/Versions/Current"
            fi
            if [ -d "$framework/Versions/Current/Resources" ] && [ ! -e "$framework/Resources" ]; then
              echo "Fixing missing Resources symlink in $(basename "$framework")"
              ln -s "Versions/Current/Resources" "$framework/Resources"
            fi
          done

      - name: Download and bundle nt-flash for sandboxed builds
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Get latest nt-flash release using gh CLI (authenticated)
          NT_FLASH_VERSION=$(gh release view --repo thorinside/nt-flash --json tagName -q .tagName)
          echo "Bundling nt-flash $NT_FLASH_VERSION"
          
          # Download macOS release
          NT_FLASH_ARCHIVE="$RUNNER_TEMP/nt-flash-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.zip"
          NT_FLASH_EXTRACT_DIR="$(mktemp -d "$RUNNER_TEMP/nt-flash-extract.XXXXXX")"
          gh release download "$NT_FLASH_VERSION" --repo thorinside/nt-flash --pattern "*-macos.zip" --output "$NT_FLASH_ARCHIVE"
          
          # Extract and place in app bundle's MacOS directory
          unzip -o "$NT_FLASH_ARCHIVE" -d "$NT_FLASH_EXTRACT_DIR"
          NT_FLASH_BIN=$(find "$NT_FLASH_EXTRACT_DIR" -name "nt-flash" -type f | head -1)
          
          # Copy to app bundle
          cp "$NT_FLASH_BIN" build/macos/Build/Products/Release/nt_helper.app/Contents/MacOS/nt-flash
          chmod +x build/macos/Build/Products/Release/nt_helper.app/Contents/MacOS/nt-flash
          
          echo "nt-flash binary info:"
          file build/macos/Build/Products/Release/nt_helper.app/Contents/MacOS/nt-flash

      - name: Embed provisioning profile in app bundle
        run: |
          cp "$RUNNER_TEMP/mac_appstore.provisionprofile" build/macos/Build/Products/Release/nt_helper.app/Contents/embedded.provisionprofile

      - name: Prepare nt-flash as embedded helper
        run: |
          # Create a proper bundle structure for nt-flash helper
          # TestFlight requires helpers to have embedded provisioning profiles
          HELPER_DIR="build/macos/Build/Products/Release/nt_helper.app/Contents/Helpers/nt-flash.app/Contents"
          mkdir -p "$HELPER_DIR/MacOS"
          
          # Move binary into helper bundle
          mv build/macos/Build/Products/Release/nt_helper.app/Contents/MacOS/nt-flash "$HELPER_DIR/MacOS/nt-flash"
          
          # Embed provisioning profile
          cp "$RUNNER_TEMP/nt_flash.provisionprofile" "$HELPER_DIR/embedded.provisionprofile"
          
          # Create minimal Info.plist for the helper using plutil (avoids heredoc whitespace issues)
          /usr/libexec/PlistBuddy -c "Add :CFBundleIdentifier string dev.nosuch.ntHelper.nt-flash" "$HELPER_DIR/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :CFBundleName string nt-flash" "$HELPER_DIR/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :CFBundleExecutable string nt-flash" "$HELPER_DIR/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :CFBundleVersion string 1" "$HELPER_DIR/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :CFBundleShortVersionString string 1.0" "$HELPER_DIR/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :CFBundlePackageType string APPL" "$HELPER_DIR/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :LSMinimumSystemVersion string 10.15" "$HELPER_DIR/Info.plist"
          
          echo "Generated Info.plist:"
          cat "$HELPER_DIR/Info.plist"
          
          echo "Helper bundle structure:"
          find build/macos/Build/Products/Release/nt_helper.app/Contents/Helpers -type f

      - name: Codesign nt-flash helper bundle
        run: |
          # Sign the helper bundle FIRST with its own identifier and entitlements
          codesign --force --verbose --options runtime \
            --sign "Apple Distribution: Neal Sanche (KN424RZG26)" \
            --entitlements macos/Runner/nt-flash.entitlements \
            --identifier "dev.nosuch.ntHelper.nt-flash" \
            "build/macos/Build/Products/Release/nt_helper.app/Contents/Helpers/nt-flash.app"
          
          # Verify the signature
          echo "Verifying helper signature:"
          codesign -d -vvv "build/macos/Build/Products/Release/nt_helper.app/Contents/Helpers/nt-flash.app" 2>&1 | grep -E "Identifier|TeamIdentifier|Authority"

      - name: Codesign the macOS App for App Store
        run: |
          # Sign WITHOUT --deep to preserve the helper's signature
          # Sign frameworks and other nested code first
          APP_BUNDLE="build/macos/Build/Products/Release/nt_helper.app"
          FRAMEWORKS_DIR="$APP_BUNDLE/Contents/Frameworks"

          find "$FRAMEWORKS_DIR" -type f -name "*.dylib" -print0 | while IFS= read -r -d '' dylib; do
            echo "Signing embedded dylib: $dylib"
            codesign --force --verbose --options runtime \
              --sign "Apple Distribution: Neal Sanche (KN424RZG26)" "$dylib"
          done

          find "$FRAMEWORKS_DIR" -type d -name "*.framework" -exec \
            codesign --force --verbose --options runtime \
              --sign "Apple Distribution: Neal Sanche (KN424RZG26)" {} \;
          
          # Sign the main app (not deep - preserves helper signature)
          codesign --force --verbose --options runtime \
            --sign "Apple Distribution: Neal Sanche (KN424RZG26)" \
            --entitlements macos/Runner/AppStore.entitlements \
            "$APP_BUNDLE"
          
          # Verify final signatures
          echo "Main app signature:"
          codesign -d -vvv "$APP_BUNDLE" 2>&1 | grep -E "Identifier|TeamIdentifier"
          echo "Helper signature (should be preserved):"
          codesign -d -vvv "$APP_BUNDLE/Contents/Helpers/nt-flash.app" 2>&1 | grep -E "Identifier|TeamIdentifier"

      - name: Create installer package (.pkg)
        run: |
          # Create a signed installer package for App Store submission
          productbuild \
            --component build/macos/Build/Products/Release/nt_helper.app /Applications \
            --sign "3rd Party Mac Developer Installer: Neal Sanche (KN424RZG26)" \
            build/macos/Build/Products/Release/nt_helper.pkg

      - name: List build output (debug)
        run: ls -R build/macos/Build/Products/Release

      - name: Upload to App Store Connect (TestFlight)
        run: |
          xcrun altool --upload-app \
            --type macos \
            --file "./build/macos/Build/Products/Release/nt_helper.pkg" \
            --username "${{ secrets.MACOS_APPLE_ID }}" \
            --password "${{ secrets.APP_SPECIFIC_PASSWORD }}" \
            --verbose

      - name: Delete installed provisioning profiles
        if: always()
        run: |
          if [ -n "${MAC_PROFILE_PATH:-}" ]; then
            rm -f "$MAC_PROFILE_PATH"
          fi
          if [ -n "${NT_FLASH_PROFILE_PATH:-}" ]; then
            rm -f "$NT_FLASH_PROFILE_PATH"
          fi

  ios:
    name: Build & Sign iOS
    runs-on: [self-hosted, macOS, ARM64]
    needs: [setup, create-release]
    if: |
      always() &&
      needs.setup.result == 'success' &&
      (needs.create-release.result == 'success' || needs.create-release.result == 'skipped') &&
      (
        github.event_name == 'push' ||
        contains(github.event.inputs.platforms, 'ios') ||
        github.event.inputs.platforms == 'all' ||
        github.event.inputs.platforms == ''
      )
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Select Xcode 26
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26'

      - name: Print macOS & Xcode info (debug)
        run: |
          echo "macOS version:"
          sw_vers
          echo "Xcode version:"
          xcodebuild -version

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Flutter Doctor (debug)
        run: flutter doctor -v

      - name: Pub get
        run: flutter pub get

      - name: Decode provisioning profile from Base64
        env:
          PROFILE_BASE64: ${{ secrets.APP_STORE_MOBILEPROVISION }}
        run: echo "$PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/distribution.mobileprovision"

      - name: Import Apple signing certificates
        uses: apple-actions/import-codesign-certs@v7
        with:
          keychain: ${{ runner.temp }}/nt-helper-${{ github.run_id }}-${{ github.job }}
          p12-file-base64: ${{ secrets.APPLE_CERTIFICATES }}
          p12-password: ${{ secrets.APPLE_CERTIFICATES_PASSWORD }}

      - name: Install Apple signing intermediates
        env:
          KEYCHAIN_PATH: ${{ runner.temp }}/nt-helper-${{ github.run_id }}-${{ github.job }}.keychain
        run: |
          curl --fail --location --silent --show-error \
            https://www.apple.com/certificateauthority/AppleWWDRCAG3.cer \
            --output "$RUNNER_TEMP/AppleWWDRCAG3.cer"
          curl --fail --location --silent --show-error \
            https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer \
            --output "$RUNNER_TEMP/DeveloperIDG2CA.cer"
          security import "$RUNNER_TEMP/AppleWWDRCAG3.cer" -k "$KEYCHAIN_PATH"
          security import "$RUNNER_TEMP/DeveloperIDG2CA.cer" -k "$KEYCHAIN_PATH"

      - name: Verify iOS signing identity
        env:
          KEYCHAIN_PATH: ${{ runner.temp }}/nt-helper-${{ github.run_id }}-${{ github.job }}.keychain
        run: |
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH" |
            grep -Fq "Apple Distribution: Neal Sanche (KN424RZG26)"

      - name: Install provisioning profile
        run: |
          PROFILE_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          IOS_PROFILE_PATH="$PROFILE_DIR/nt-helper-${GITHUB_RUN_ID}-${GITHUB_JOB}.mobileprovision"
          mkdir -p "$PROFILE_DIR"
          cp "$RUNNER_TEMP/distribution.mobileprovision" "$IOS_PROFILE_PATH"
          echo "IOS_PROFILE_PATH=$IOS_PROFILE_PATH" >> "$GITHUB_ENV"
          echo "Provisioning profiles in that folder:"
          ls -la "$PROFILE_DIR"

      - name: Install iOS Simulator Runtime
        run: |
          echo "Available Xcode simulators:"
          xcrun simctl list runtimes
          echo "Installing iOS simulator runtime if needed..."
          xcodebuild -downloadPlatform iOS || true
          echo "Available simulators after install attempt:"
          xcrun simctl list runtimes

      - name: Flutter build IPA
        run: |
          set -x
          flutter clean
          flutter pub get
          flutter build ipa --export-options-plist=ios/ExportOptions.plist

      - name: Debug List final artifacts
        run: ls -R build/ios/ipa || true

      - name: Upload to TestFlight
        run: |
          xcrun altool --upload-app \
            --type ios \
            --file "./build/ios/ipa/nt_helper.ipa" \
            --username "${{ secrets.MACOS_APPLE_ID }}" \
            --password "${{ secrets.APP_SPECIFIC_PASSWORD }}" \
            --verbose

      - name: Delete installed provisioning profile
        if: always()
        run: |
          if [ -n "${IOS_PROFILE_PATH:-}" ]; then
            rm -f "$IOS_PROFILE_PATH"
          fi
