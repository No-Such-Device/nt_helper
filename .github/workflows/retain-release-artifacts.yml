name: Retain five published releases

on:
  schedule:
    - cron: '29 6 * * *'
  workflow_run:
    workflows: ['Multi-Platform Build']
    types: [completed]

permissions:
  contents: read

concurrency:
  group: retain-release-actions-artifacts
  cancel-in-progress: false

jobs:
  cleanup:
    if: >-
      github.repository == 'No-Such-Device/nt_helper' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'schedule' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_repository.full_name == github.repository &&
        startsWith(github.event.workflow_run.head_branch, 'v')))
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 60
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false
      - name: Test retention safety
        run: python3 -m unittest discover -s scripts -p 'test_retain_release_artifacts.py' -v
      - name: Retain five release versions
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 scripts/retain_release_artifacts.py --apply
          --evidence-dir "$RUNNER_TEMP/release-retention-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
      - name: Print audit receipts
        if: always()
        env:
          EVIDENCE: ${{ runner.temp }}/release-retention-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          directory = Path(os.environ['EVIDENCE'])
          for name in ('manifest.json', 'manifest.sha256', 'receipts.json', 'release-receipts.json'):
              path = directory / name
              if path.exists():
                  print(f'--- {name} ---\n{path.read_text()}')
          PY
